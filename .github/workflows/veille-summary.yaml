name: veille-summary

# Daily French AI digest of the francophone tech RSS feeds. Generates the
# digest with a single OpenRouter chat completion (OPENROUTER_API_KEY repo
# secret), no Claude subscription/OAuth token. Toolchain: scripts/veille/.
# Output: one file per day under digests/, plus digests/index.json (listing)
# and digests/config.json (cadence in days, read by the guard step below).
#
# Moved here from Gloweet/gitops-demo on 2026-09-11 (that repo is GitOps-only;
# this is the actual publish target — a public repo the fork's Glance widget
# reads unauthenticated via raw.githubusercontent.com).
#
# Originally ran the agentic Claude Code GitHub Action on a
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Dropped 2026-09-14:
# that token is tied to the subscription of whoever last ran
# `claude setup-token`, and gets invalidated whenever the same account
# re-authenticates elsewhere (e.g. a local `claude` session) — root-caused
# twice (401 "OAuth access token is invalid") within a week. Replaced with a
# single non-agentic OpenRouter call (generate_digest.py); the account is
# pay-per-token and independent of any local session.

on:
  schedule:
    - cron: "37 5 * * *" # ~07:37 Europe/Paris (CEST); ~06:37 in winter (CET)
  workflow_dispatch:

concurrency:
  group: veille-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      step_days: ${{ steps.check.outputs.step_days }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cadence (digests/config.json step_days vs. last digest date)
        id: check
        run: |
          step_days=$(jq -r '.step_days // 1' digests/config.json)
          last_date=$(jq -r '.entries[0].date // empty' digests/index.json)
          today=$(date -u +%Y-%m-%d)
          if [ -z "$last_date" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            days_since=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$last_date" +%s) ) / 86400 ))
            if [ "$days_since" -ge "$step_days" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "skipping: last digest $last_date, step_days=$step_days, days_since=$days_since"
            fi
          fi
          echo "step_days=$step_days" >> "$GITHUB_OUTPUT"

  digest:
    needs: guard
    # Manual triggers (workflow_dispatch, e.g. the Glance widget's regenerate
    # button) bypass the cadence guard: the user explicitly asked for a digest.
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and publish digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }} # optional, defaults to anthropic/claude-sonnet-5
        run: |
          python3 scripts/veille/generate_digest.py "$(pwd)" "${{ needs.guard.outputs.step_days }}" \
            | python3 scripts/veille/update_archive.py "$(pwd)"
